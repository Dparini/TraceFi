name: offline-quality
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 3 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install '.[dev]' wheel 'setuptools>=68'
      - run: ruff check tracefi tests scripts examples
      - run: ruff format --check tracefi tests scripts examples
      - run: mypy tracefi
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python scripts/check_install.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-python-${{ matrix.python }}
          path: test-results.xml
  stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,mutation]'
      - run: python -m pytest -q tests/test_properties.py tests/test_edge_cases.py
        env:
          HYPOTHESIS_PROFILE: stress
      - run: mutmut run --max-children 4 > mutation-run.txt 2>&1
        env:
          HYPOTHESIS_PROFILE: mutation
      - run: mutmut results > mutation-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: mutation-*.txt
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm audit --omit=dev
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
      - run: git diff --exit-code -- tracefi/web
