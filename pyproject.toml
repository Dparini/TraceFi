[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttrace"
version = "0.1.0"
description = "Local observability and debugging for autonomous financial agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AgentTrace contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
agenttrace = "agenttrace.cli:main"

[tool.setuptools.packages.find]
include = ["agenttrace*"]

[tool.setuptools.package-data]
agenttrace = ["datasets/**/*.json", "web/*.html", "web/assets/*"]
