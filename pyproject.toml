[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefi"
version = "0.1.0"
description = "Decision provenance, failure attribution and counterfactual debugging for financial agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TraceFi contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]
dependencies = []

[project.scripts]
tracefi = "tracefi.cli:main"

[tool.setuptools.packages.find]
include = ["tracefi*"]

[tool.setuptools.package-data]
tracefi = ["datasets/**/*.json", "web/*.html", "web/assets/*"]
